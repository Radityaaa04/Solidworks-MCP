[project]
name = "solidworks-mcp"
version = "0.1.0"
description = "Production-grade Model Context Protocol (MCP) server for SolidWorks 2026 CAD automation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.3.0",
    "pywin32>=308",
    "pydantic>=2.10",
    "pillow>=11.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sw_mcp"]
